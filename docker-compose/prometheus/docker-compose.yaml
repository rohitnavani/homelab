services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # Host_Port:Container_Port
    volumes:
      - ${COMPOSE_BASE_PATH}/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${COMPOSE_BASE_PATH}/prometheus/rules:/etc/prometheus/rules
      - ${COMPOSE_BASE_PATH}/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver' # Your existing command-line argument
      # You can add other Prometheus specific arguments here if needed, e.g.:
      # - '--storage.tsdb.path=/prometheus'
      # - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      # - '--web.console.templates=/usr/share/prometheus/consoles'

volumes:
  prometheus_data: {} # Defines the named volume
