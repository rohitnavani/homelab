# Immich on mementos (since 2026-11-17): server, Postgres and Valkey, from the v3.4.1 release compose.
# - Machine learning runs on tinynas (/pool/docker-compose/immich-ml, 10.0.0.5:3003). The name
#   immich-machine-learning resolves there through extra_hosts, so Immich's default ML URL works unchanged.
# - Public access: tinynas nginx serves immich.rohitnavani.com on 443 (DNS-only CNAME to direct-ip) and
#   proxies to 10.0.0.10:2283. No Cloudflare tunnel: its 100 MB request cap breaks phone video uploads.
# - Library and DB: vmPool/data/immich/{library,postgres}; hourly snapshots, pulled by tinynas and sojiro.
# - Upgrade: bump IMMICH_VERSION here (.env) AND in tinynas's immich-ml/.env together, and diff this file
#   against the new release's docker-compose.yml first.
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?set IMMICH_VERSION in .env}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    extra_hosts:
      - 'immich-machine-learning:10.0.0.5'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD' # vmPool is 10K SAS mirrors (SSDs only as SLOG/L2ARC)
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
