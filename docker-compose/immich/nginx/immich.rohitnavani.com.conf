# Immich (server on mementos, 10.0.0.10:2283), public since 2026-11-17.
# DNS: immich CNAME -> direct-ip.rohitnavani.com, DNS only (no Cloudflare proxy or tunnel: its 100 MB
# request cap breaks phone video uploads). The UDW forwards 80/443 here; LAN clients reach this box
# through an AdGuard rewrite to 10.0.0.5. Cert: certbot, nginx authenticator (snap renew timer).
server {
    listen 80;
    listen [::]:80;
    server_name immich.rohitnavani.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name immich.rohitnavani.com;

    ssl_certificate /etc/letsencrypt/live/immich.rohitnavani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immich.rohitnavani.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;        # originals of any size (4K phone videos)
    proxy_request_buffering off;   # stream uploads to mementos instead of spooling them on tinynas
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    # First-run admin sign-up only from the LAN (VPN clients arrive as 10.0.0.3 via futaba), so nobody
    # on the internet can claim the instance before the admin account exists.
    location = /api/auth/admin-sign-up {
        allow 10.0.0.0/24;
        deny all;
        proxy_pass http://10.0.0.10:2283;
    }

    location / {
        proxy_pass http://10.0.0.10:2283;
    }
}
