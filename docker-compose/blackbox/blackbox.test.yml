# promtool unit tests for ProberDown and SiteDown (blackbox.yml) and TargetDown (../../monitoring/alerts-rules.yml):
# promtool test rules blackbox.test.yml
rule_files:
  - blackbox.yml
  - ../../monitoring/alerts-rules.yml
evaluation_interval: 1m
tests:
  - name: A dead prober is one ProberDown, not a TargetDown or SiteDown per site
    interval: 1m
    input_series:
      - series: 'up{instance="https://rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x5 0x15'
      - series: 'up{instance="https://ha.rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x5 0x15'
      - series: 'up{instance="https://money.rohitnavani.com/healthz",job="money_health"}'
        values: '1x5 0x15'
      # a failed scrape leaves no probe_success at all
      - series: 'probe_success{instance="https://rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x5 _x15'
      - series: 'up{instance="10.0.0.3",job="node"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 8m, alertname: ProberDown, exp_alerts: []}
      - eval_time: 12m
        alertname: ProberDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Site checks not running: 3 probe(s) can't be scraped from blackbox-exporter on futaba"
              description: "This is the prober, not the sites. On futaba: cd ~/monitoring && docker compose ps -a blackbox-exporter, then docker compose up -d blackbox-exporter."
      - {eval_time: 12m, alertname: TargetDown, exp_alerts: []}
      - {eval_time: 12m, alertname: SiteDown, exp_alerts: []}

  - name: A host that stops answering is still TargetDown, and the prober stays quiet
    interval: 1m
    input_series:
      - series: 'up{instance="10.0.0.9",job="node"}'
        values: '1x5 0x15'
      - series: 'up{instance="https://rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: 10.0.0.9, job: node}
            exp_annotations:
              summary: "Scrape target down: node 10.0.0.9"
              description: "Prometheus on futaba has not been able to scrape 10.0.0.9 (job node) for 5m."
      - {eval_time: 12m, alertname: ProberDown, exp_alerts: []}

  - name: One failing site with a working prober is SiteDown only
    interval: 1m
    input_series:
      - series: 'up{instance="https://cockpit.rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x20'
      - series: 'probe_success{instance="https://cockpit.rohitnavani.com",job="blackbox",module="http_2xx"}'
        values: '1x5 0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: SiteDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "https://cockpit.rohitnavani.com", job: blackbox, module: http_2xx}
            exp_annotations:
              summary: "Site down: https://cockpit.rohitnavani.com"
              description: "The blackbox probe from futaba (http_2xx) has failed for 5m. Check the Cloudflare tunnel, the nginx host and the app behind it."
      - {eval_time: 12m, alertname: ProberDown, exp_alerts: []}
      - {eval_time: 12m, alertname: TargetDown, exp_alerts: []}
