services:
  netdata:
    image: netdata/netdata
    container_name: netdata
    hostname: "TinyNAS-netdata" # set your host's hostname
    # Or, if you want a specific name: hostname: tinynas-netdata
    cap_add:
      - SYS_PTRACE # required for most collectors
      - NET_ADMIN # required for network QoS (traffic shaping)
      - SYS_ADMIN # required for cgroups
    security_opt:
      - apparmor:unconfined # recommended for full metric collection
    environment:
      - PUID=1000 # Replace with your user ID (run 'id -u rohit')
      - PGID=1000 # Replace with your group ID (run 'id -g rohit')
      - TZ=America/New_York # Replace with your timezone, e.g., Europe/London
    volumes:
      - netdatacfg:/etc/netdata # For Netdata configuration
      - netdatalib:/var/lib/netdata # For Netdata database
      - netdatacache:/var/cache/netdata # For Netdata cache
      - /etc/passwd:/etc/passwd:ro # Read-only access to host system info
      - /etc/group:/etc/group:ro # Read-only access to host system info
      - /proc:/host/proc:ro # Important for collecting system metrics
      - /sys:/host/sys:ro # Important for collecting system metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro # For Docker container metrics
    ports:
      - 19999:19999 # Default Netdata port
    restart: unless-stopped
    read_only: false # Allow Netdata to write to its own volumes

volumes:
  netdatacfg:
  netdatalib:
  netdatacache:
