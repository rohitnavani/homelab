# rohitnavani.com: resume site (container on 127.0.0.1:8081). /status-api/ (Uptime Kuma) removed 2026-10-15.
# Moved from tinynas 2026-10-14; Cloudflare tunnel route for rohitnavani.com -> http://10.0.0.3:80.
server {
    listen 80;
    listen [::]:80;
    server_name rohitnavani.com www.rohitnavani.com;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
