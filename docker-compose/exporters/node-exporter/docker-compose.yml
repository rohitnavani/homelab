services:
  node-exporter:
    image: prom/node-exporter:latest # Use the official image
    container_name: node-exporter
    hostname: "TinyNAS"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/run/.+)($|/)'
      - '--collector.textfile.directory=/etc/node_exporter/textfile_collector' # IMPORTANT: Path INSIDE container
      # Remove --collector.zfs as the textfile handles ZFS now
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
      - /var/lib/node_exporter/textfile_collector:/etc/node_exporter/textfile_collector:ro # Host path to container path
    restart: unless-stopped
    network_mode: host
    privileged: true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080" # cAdvisor's default port
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true # Required for some metrics on older kernels/setups
    restart: unless-stopped
